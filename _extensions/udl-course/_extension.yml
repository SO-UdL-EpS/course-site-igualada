title: UDL Course Framework
author: Jordi Mateo Fornés
version: 1.3.0
quarto-required: ">=1.4.0"

# Deliberately a plain FORMAT extension, not a "project type" extension.
# An earlier version used `contributes.project` to auto-configure
# website/sidebar defaults too, but that mechanism's merge behavior
# could not be verified and failed twice in practice. This is the
# simpler, first-documented Quarto pattern (see Quarto's "Custom
# Formats" docs) and only does one job: define udl-course-html.
# Website/sidebar settings now live explicitly in the consuming
# project's own _quarto.yml (see this repo's root _quarto.yml).
contributes:
  formats:
    html:
      toc: true
      code-copy: true
      code-overflow: wrap
      theme:
        light: [cosmo, styles/styles.scss]
        dark: [cosmo, styles/styles.scss, styles/dark.scss]
      respect-user-color-scheme: true
      filters:
        - components.lua
      # components.lua emits <use href="…assets/icons.svg#…"> inside raw
      # HTML it generates at filter time. Quarto's static resource scanner
      # only discovers files referenced through parseable markdown (e.g.
      # ![](path)) or explicit "resources" declarations — it cannot see
      # paths built dynamically inside a Lua filter's output. Without this
      # declaration the icon sprite is never copied to the output
      # directory at all, so every icon link 404s regardless of how the
      # path itself is written.
      resources:
        - assets/icons.svg
    pdf:
      # Document PDF export (labs/lectures) — NOT slide export, see
      # documentation/pdf-export.md for that (different mechanism).
      # xelatex is required for custom fonts; colorlinks/linkcolor use
      # the brand maroon. This intentionally stays simple (no custom
      # LaTeX theme/class) — see documentation/pdf-export.md for why
      # a full Beamer-style theme is a separate, harder, unstarted task.
      pdf-engine: xelatex
      mainfont: "Inter"
      monofont: "JetBrains Mono"
      colorlinks: true
      linkcolor: "7a2648"
      urlcolor: "254367"
      geometry:
        - margin=2.5cm
      filters:
        - components.lua
